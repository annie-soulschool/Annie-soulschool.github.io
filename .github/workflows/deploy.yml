name: Deploy Site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject API key into JS files
        env:
          API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
        run: |
          sed -i "s|__GOOGLE_CALENDAR_API_KEY__|${API_KEY}|g" scripts/calendar.js
          sed -i "s|__GOOGLE_CALENDAR_API_KEY__|${API_KEY}|g" scripts/calendar-embed.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github,.git'
