<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Soul School — A new educational playground for the future human.">
  <meta name="theme-color" content="#0A0A08">
  <title>Soul School Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../styles/what-is-soul-school.css">
</head>
<script>
  if (!sessionStorage.getItem('soulschool_auth')) {
    window.location.replace('enter.html');
  }
</script>
<body>

  <!-- ── Top navigation ── -->
  <nav class="site-nav">
    <a href="../index.html" class="site-nav-logo">Soul School</a>
    <span class="wearefree-tag">WEAREFREE</span>
  </nav>

  <!-- ── Hero heading ── -->
  <section class="wiss-hero">
    <h1 class="wiss-heading">You don't need more information.</h1>
    <p class="wiss-subheading">The best way to understand Soul School is <em>STILL</em> to show up.</p>
  </section>

  <!-- ── Upcoming events ── -->
  <section class="wiss-events">
    <div class="event-cards" id="portal-event-cards">
      <!-- Populated by scripts/calendar-embed.js after WEAREFREE auth -->
    </div>
  </section>

  <!-- ── Carousel ── -->
  <!-- Carousel: images will load from assets/carousel-images/ -->
  <section class="wiss-carousel-section">
    <div class="wiss-carousel" id="wiss-carousel">
      <!-- Placeholder boxes — replace with <img src="../assets/carousel-images/filename.jpg"> -->
      <img src="../assets/Carousel-img/wearefree-grass.jpg" alt="We Are Free in sticks in the grass" class="carousel-image">
      <img src="../assets/Carousel-img/Annie-Hike.jpeg" alt="Annie and Marjorie Hike" class="carousel-image">
      <img src="../assets/Carousel-img/Flyer.jpeg" alt="Soul School Talk flyer" class="carousel-image">
      <img src="../assets/Carousel-img/GrassGathering.jpeg" alt="Class in the grass" class="carousel-image">
      <img src="../assets/Carousel-img/Puppers.jpeg" alt="Puppie dog" class="carousel-image">
      <img src="../assets/Carousel-img/AreYouOkay.jpeg" alt="Chaotic black and white print with Are You Okay in the middle" class="carousel-image">
      <img src="../assets/Carousel-img/Sky.jpeg" alt="Photo of class with sky background" class="carousel-image">
      <img src="../assets/Carousel-img/Friends.jpeg" alt="Annie with friends" class="carousel-image">
      <img src="../assets/Carousel-img/WalkAway.jpeg" alt="Photo of a brief passage on a white paper" class="carousel-image">
      <!-- <img src="carousel-placeholder-box">Image 4</img>
      <img src="carousel-placeholder-box">Image 5</img> -->
    </div>
  </section>

  <!-- ── YouTube embed ── -->
  <section class="wiss-video-section">
    <div class="wiss-video-wrap">
      <iframe
        class="wiss-video-iframe"
        src="https://www.youtube.com/embed/OdUoW1oihdQ"
        title="Soul School video"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
      ></iframe>
    </div>
    <p class="wiss-video-credit">By AJ Terio</p>
  </section>

  <!-- ── We Are Free image ── -->
  <section class="wiss-wearefree-section">
    <img
      src="../assets/We-are-free-GOLD.png"
      alt="We Are Free — Soul School community"
      class="wiss-wearefree-img"
    >
  </section>

  <!-- ── SoundCloud ── -->
  <iframe width="100%" height="300" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A2295693275&color=%23718049&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true"></iframe><div style="font-size: 10px; color: #cccccc;line-break: anywhere;word-break: normal;overflow: hidden;white-space: nowrap;text-overflow: ellipsis; font-family: Interstate,Lucida Grande,Lucida Sans Unicode,Lucida Sans,Garuda,Verdana,Tahoma,sans-serif;font-weight: 100;"><a href="https://soundcloud.com/annie-today" title="Annie Today" target="_blank" style="color: #cccccc; text-decoration: none;">Annie Today</a> · <a href="https://soundcloud.com/annie-today/sovereign-free" title="Sovereign &amp; Free" target="_blank" style="color: #cccccc; text-decoration: none;">Sovereign &amp; Free</a></div>

  <!-- ── Book a Call ── -->
  <section class="wiss-booking-section">
    <h2 class="wiss-booking-prompt">If you're ready, let's talk.</h2>
    <!-- TODO: Replace href with actual booking link -->
    <a href="https://calendly.com/annie-margaret/30min?month=2026-04" class="btn-pill wiss-booking-btn">Book a Call</a>
  </section>

  <!-- ── Footer ── -->
  <footer class="site-footer">
    <span class="site-footer-logo">Soul School</span>
    <span class="site-footer-copy">2026 Soul School</span>
  </footer>

  <script src="../scripts/calendar-embed.js"></script>
  <script>
    // Calendar loads immediately — auth guard at top of page already
    // confirmed the WEAREFREE password was entered this session.
    document.addEventListener('DOMContentLoaded', function () {
      initPortalCalendar('portal-event-cards', 6);
    });
  </script>

</body>
</html>
